name: CodeQL

# Static analysis (SAST) of the loader C/C++ sources, the Python bindings and
# the workflow files. Results go to the Security > Code scanning tab.
on:
  # Allow manual runs from the Actions tab ("Run workflow" button).
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '37 19 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    if: github.repository_owner == 'oneapi-src'
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [ "c-cpp", "python", "actions" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"

name: CodeQL

# Static analysis (SAST) of the loader C/C++ sources, the Python bindings and
# the workflow files. Results go to the Security > Code scanning tab.
on:
  # Allow manual runs from the Actions tab ("Run workflow" button).
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '37 19 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    if: github.repository_owner == 'oneapi-src'
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [ "c-cpp", "python", "actions" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
